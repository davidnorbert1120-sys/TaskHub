<nav class="th-navbar">
  <div class="th-navbar-inner">
    <a class="th-brand" routerLink="">
      <span class="th-brand-logo">T</span>
      <span class="th-brand-name">TaskHub</span>
    </a>

    <div class="th-nav-links">
      <a *ngIf="isLoggedIn()" class="th-nav-link" routerLink="projects" routerLinkActive="active">
        Projektek
      </a>
    </div>

    <div class="th-nav-actions">
      <ng-container *ngIf="!isLoggedIn()">
        <a class="th-nav-link" routerLink="register" routerLinkActive="active">Regisztráció</a>
        <a class="btn btn-primary btn-sm" routerLink="login">Bejelentkezés</a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn()">
        <span class="th-user">
          <span class="th-user-avatar">{{ (getCurrentUser()?.username ?? '?').charAt(0).toUpperCase() }}</span>
          <span class="th-user-name">{{ getCurrentUser()?.username }}</span>
        </span>
        <button class="btn btn-outline-secondary btn-sm" (click)="logout()">Kilépés</button>
      </ng-container>
    </div>
  </div>
</nav>
