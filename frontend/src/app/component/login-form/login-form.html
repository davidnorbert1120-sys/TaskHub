<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">TaskHub</div>
    <h2 class="auth-title">Bejelentkezés</h2>
    <p class="auth-subtitle">Üdv újra! Lépj be a fiókodba.</p>

    <div *ngIf="globalError" class="alert alert-danger">{{ globalError }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="mb-3">
        <label for="username" class="form-label">Felhasználónév</label>
        <input id="username" type="text" class="form-control"
               formControlName="username"
               [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        <div class="invalid-feedback" *ngIf="loginForm.get('username')?.errors?.['required'] && loginForm.get('username')?.touched">
          A felhasználónév kötelező.
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Jelszó</label>
        <input id="password" type="password" class="form-control"
               formControlName="password"
               [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched">
          A jelszó kötelező.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
        {{ submitting ? 'Bejelentkezés...' : 'Bejelentkezés' }}
      </button>

      <div class="auth-divider"><span>vagy</span></div>

      <a href="http://localhost:8080/oauth2/authorization/google" class="btn btn-google w-100">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.64-.06-1.25-.17-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92a8.78 8.78 0 0 0 2.68-6.61z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.97 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.29-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.33z" fill="#FBBC05"/>
          <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Bejelentkezés Google-lal
      </a>

      <div class="auth-footer">
        Nincs még fiókod? <a routerLink="/register">Regisztrálj!</a>
      </div>
    </form>
  </div>
</div>
