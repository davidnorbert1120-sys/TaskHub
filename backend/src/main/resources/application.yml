spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskhub_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    jpa:
      repositories:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:ezEgyNagyonHosszuTitkosKulcsAmitLegalabb256BitHosszuraKellCsinalniHMACSHA256hoz12345}
    expiration-ms: 3600000  # 1 óra

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.taskhub: DEBUG
    org.hibernate.SQL: WARN
